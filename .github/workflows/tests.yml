name: Tests

# Runs the automated test suite (tests/) on every push to main and on every
# pull request, so a change that breaks a numerical result is caught before it
# is released. Run the same thing locally from the repo root with:
#   python -m unittest discover -s tests -v
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # manual "Run workflow" button

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]   # oldest supported (see requires-python) and a recent one
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Everything the library imports at load time. sentence-transformers (and
      # so torch, ~2 GB) is only imported lazily by the text-embedding features,
      # which the tests don't touch, so it is left out to keep this job fast.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0" scipy tdt pandas openpyxl statsmodels scikit-learn

      # Run from the repo root so `import PhysicsLibrary` picks up this checkout.
      - name: Run tests
        run: python -m unittest discover -s tests -v
