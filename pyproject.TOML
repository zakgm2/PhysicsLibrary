[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "PhysicsLibrary"
version = "1.2.1"
description = "Data processing library for Physics"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["PhysicsLibrary*"]
